 <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #0b57d0;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .search {
            margin: 20px;
            padding: 15px;
            width: calc(100% - 70px);
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
        }

        .app {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
        }

        .app h2 {
            margin-top: 0;
        }

        .download {
            background: #0b57d0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My App Store</h1>
        <p>আপনার নিজের অ্যাপ স্টোর</p>
    </header>

    <input
        class="search"
        type="text"
        placeholder="অ্যাপ খুঁজুন..."
    >

    <div class="app">
        <h2>আমার প্রথম অ্যাপ</h2>
        <p>এটি আমাদের App Store-এর প্রথম অ্যাপ।</p>
        <button class="download">Download</button>
    </div>

</body>
</html>
